name: Build Typst document
on: push

jobs:
  build_typst_documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Fonts
        uses: fontist/setup-fontist@v2
      - run: fontist update
      - run: |
          fontist install "source_sans_3"
          fontist install "space_grotesk"
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
      - run: |
         typst fonts --font-path ~/.fontist/fonts
         typst compile bingo.typ bingo.pdf --font-path ~/.fontist/fonts
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: bingo.pdf